appId: com.photobase.app
productName: PhotoBase
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.editorconfig,.prettierrc,psalm.xml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # Build-time only: none of this is read once the app is installed.
  - '!{tailwind.config.js,postcss.config.js,pnpm-workspace.yaml}'
  - '!{README.md,.mcp.json,.gitattributes}'
  - '!build/*'
asarUnpack:
  - resources/**
win:
  executableName: PhotoBase
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
linux:
  target: AppImage
  category: Graphics
