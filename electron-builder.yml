appId: com.photobase.app
productName: PhotoBase
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.editorconfig,.prettierrc,psalm.xml}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # Build-time only: none of this is read once the app is installed.
  - '!{tailwind.config.js,postcss.config.js,pnpm-workspace.yaml}'
  - '!{README.md,.mcp.json,.gitattributes}'
  # README imagery: 5 MB of screenshots the installed app never opens.
  - '!docs'
  - '!build/*'
  # Placed per platform by extraResources, never bundled into the asar.
  - '!resources/ffmpeg'
asarUnpack:
  - resources/**
win:
  executableName: PhotoBase
  # Only this platform's binary: the other is 79 MB of dead weight.
  extraResources:
    - from: resources/ffmpeg/ffmpeg-win32-x64.exe
      to: ffmpeg/ffmpeg-win32-x64.exe
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
linux:
  extraResources:
    - from: resources/ffmpeg/ffmpeg-linux-x64
      to: ffmpeg/ffmpeg-linux-x64
  target: AppImage
  category: Graphics
